services:
  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: change-me-in-production
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: backend,localhost,127.0.0.1
      # First admin account (only created when no admin exists yet):
      SATHUB_ADMIN_USERNAME: admin
      SATHUB_ADMIN_PASSWORD: change-me-too
    volumes:
      - sathub-data:/app/data
      - sathub-duckdb:/app/duckdb
    ports:
      - "8000:8000"

  backend-worker:
    build: ./backend
    # Wait for migrations before the worker starts claiming jobs.
    command: ["sh", "-c", "python manage.py migrate && python manage.py bootstrap_admin && exec python manage.py run_ingestion_worker"]
    environment:
      DJANGO_SECRET_KEY: change-me-in-production
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: backend,localhost,127.0.0.1
    volumes:
      - sathub-data:/app/data
      - sathub-duckdb:/app/duckdb
    depends_on:
      - backend

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  sathub-data:
  sathub-duckdb:
